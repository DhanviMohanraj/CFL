name: DriftAdapt CI Pipeline

on:
  push:
    branches: [ main, master, "feature/**", "release/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy pytest pytest-cov httpx fastapi pydantic torch loguru
          if [ -f requirements/base.txt ]; then pip install -r requirements/base.txt; fi
          if [ -f requirements/dev.txt ]; then pip install -r requirements/dev.txt; fi

      - name: Bootstrap Environment Directories
        run: |
          python scripts/bootstrap.py

      - name: Code Formatting & Lint Check (flake8)
        run: |
          flake8 . --exclude=.venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Static Type Checking (mypy)
        run: |
          mypy app

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage/coverage.xml

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage/coverage.xml

      - name: Build Verification
        run: |
          python -m pip install build
          python -m build --wheel
