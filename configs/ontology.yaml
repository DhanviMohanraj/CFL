    category: "Maternal & Child Health"
    keywords: ["pregnancy", "antenatal", "preeclampsia", "eclampsia", "folic acid", "trimester", "anemia in pregnancy", "hemoglobin"]
    mesh_terms: ["D011247"]

  - id: "child_malnutrition"
    name: "Child Malnutrition & Stunting"
    category: "Maternal & Child Health"
    keywords: ["kwashiorkor", "marasmus", "stunting", "wasting", "sam", "mam", "mid-upper arm circumference", "muac", "rutf"]
