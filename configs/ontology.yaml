# Condition Ontology for CHW Healthcare Benchmark
# Defines 16 CHW-relevant condition categories and keyword triggers for mapping

version: "1.0"
conditions:
  - id: "vector_malaria"
    name: "Malaria"
    category: "Vector-borne"
    keywords: ["malaria", "plasmodium", "falciparum", "vivax", "chills", "fever spike", "anopheles", "artemisinin"]
    mesh_terms: ["D008511"]

  - id: "vector_dengue"
    name: "Dengue Fever"
    category: "Vector-borne"
    keywords: ["dengue", "breakbone", "aedes", "thrombocytopenia", "petechiae", "tourniquet test", "ns1"]
    mesh_terms: ["D003803"]

  - id: "vector_chikungunya"
    name: "Chikungunya"
    category: "Vector-borne"
    keywords: ["chikungunya", "joint pain", "arthralgia", "aedes albopictus", "stooped posture"]
    mesh_terms: ["D000071243"]

  - id: "respiratory_tb"
    name: "Tuberculosis"
    category: "Respiratory"
    keywords: ["tuberculosis", "tb", "mycobacterium", "hemoptysis", "night sweats", "mantoux", "rifampicin", "dots"]
    mesh_terms: ["D014376"]

  - id: "respiratory_pneumonia"
    name: "Pneumonia"
    category: "Respiratory"
    keywords: ["pneumonia", "consolidation", "crackles", "streptococcus pneumoniae", "sputum", "bronchial breath"]
    mesh_terms: ["D011014"]

  - id: "respiratory_ari"
    name: "Acute Respiratory Infection"
    category: "Respiratory"
    keywords: ["bronchitis", "cough", "wheezing", "rhinovirus", "influenza", "upper respiratory", "croup", "stridor"]
    mesh_terms: ["D012141"]

  - id: "gastro_cholera"
    name: "Cholera & Severe Diarrhea"
    category: "Gastrointestinal"
    keywords: ["cholera", "vibrio", "rice water stool", "dehydration", "ors", "zinc", "diarrhea", "gastroenteritis"]
    mesh_terms: ["D002771"]

  - id: "gastro_typhoid"
    name: "Typhoid Fever"
    category: "Gastrointestinal"
    keywords: ["typhoid", "salmonella typhi", "enteric fever", "rose spots", "widal", "bradycardia", "ceftriaxone"]
    mesh_terms: ["D014435"]

  - id: "gastro_amoebiasis"
    name: "Amoebiasis & Dysentery"
    category: "Gastrointestinal"
    keywords: ["amoebiasis", "entamoeba", "dysentery", "bloody stool", "tenesmus", "metronidazole"]
