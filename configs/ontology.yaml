  - id: "child_measles"
    name: "Measles & Vaccine Preventable"
    category: "Maternal & Child Health"
    keywords: ["measles", "koplik spots", "rubella", "pertussis", "dpt vaccine", "vit A deficiency", "maculopapular rash"]
